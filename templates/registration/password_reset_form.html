{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Have you forgot your password?{% endblock title %}

{% block content %}
<h1>Have you forgot your password?</h1>
<p>Enter your email address and we will send you email.</p>
<form method="POST">{% csrf_token %}
    {{form|crispy}}
    <input class="btn btn-success" type="submit" value="Send!">
</form>
{% endblock content %}
