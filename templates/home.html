{% extends 'base.html' %}
{% block title %}Main page{% endblock title %}
{% block content %}
   {% if user.is_authenticated %}
       {{user.username}}!
       <p>
        <form action="{% url 'logout' %}" method="post">
    {% csrf_token %}
    <button type="submit">Logout</button>
</form>
    </p>
    {% else %}
         <p>You haven't login</p>
         <a href="{% url 'login' %}">Login</a> |
         <a href="{% url 'signup' %}">Signup</a>
    {% endif %}
{% endblock content %}
